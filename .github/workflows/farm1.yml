name: 🌱 Farm 1

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: farm1
  cancel-in-progress: false

jobs:
  farm:
    name: Farm 1
    uses: ./.github/workflows/farm-runner.yml
    with:
      farm_id: 1
      farm_name: "🌱 Farm 1"
    secrets: inherit
