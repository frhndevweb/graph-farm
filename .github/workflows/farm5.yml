name: 🌱 Farm 5

on:
  schedule:
    - cron: "4-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: farm5
  cancel-in-progress: false

jobs:
  farm:
    name: Farm 5
    uses: ./.github/workflows/farm-runner.yml
    with:
      farm_id: 5
      farm_name: "🌱 Farm 5"
    secrets: inherit
