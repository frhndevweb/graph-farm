name: 🌱 Farm 8

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: farm8
  cancel-in-progress: false

jobs:
  farm:
    name: Farm 8
    uses: ./.github/workflows/farm-runner.yml
