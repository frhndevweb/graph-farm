    - cron: "4-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: farm10
  cancel-in-progress: false

jobs:
  farm:
    name: Farm 10
    uses: ./.github/workflows/farm-runner.yml
