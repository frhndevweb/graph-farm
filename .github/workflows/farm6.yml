name: 🌱 Farm 6

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: farm6
  cancel-in-progress: false

jobs:
  farm:
    name: Farm 6
    uses: ./.github/workflows/farm-runner.yml
    with:
      farm_id: 6
      farm_name: "🌱 Farm 6"
    secrets: inherit
